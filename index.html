
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Game Show Soundboard</title>


<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #252525;
  color: white;
}

body {
  padding-bottom: 12px;
}

#screen {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
}

/* STATUS */

#status {
  background: #dc3545;
  color: white;
  padding: 16px 8px;
  border-radius: 15px;
  text-align: center;
  font-size: clamp(22px, 5vw, 32px);
  font-weight: bold;
}

/* FOLDERS */

#folders {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.folder-header {
  width: 100%;
  min-height: 45px;
  border: none;
  background: #0756c9;
  color: white;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 12px;
  font-size: 23px;
  font-weight: bold;
  text-align: left;
  cursor: pointer;
}

.folder-header:active {
  background: #003d9e;
}

.arrow {
  font-size: 22px;
  width: 20px;
  transition: transform 0.15s;
}

.folder-header.closed .arrow {
  transform: rotate(-90deg);
}

.folder-icon {
  font-size: 25px;
}

/* FOLDER CONTENT */

.folder-content {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding: 10px;
  background: #252525;
}

.folder-content.hidden {
  display: none;
}

/* COLORFUL MP3 BUTTONS */

.sound-file {
  width: 100%;
  min-width: 0;
  min-height: 115px;
  border: none;
  border-radius: 17px;
  color: white;
  font-size: clamp(14px, 3.5vw, 21px);
  font-weight: bold;
  cursor: pointer;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 7px;

  padding: 9px 5px;
  touch-action: manipulation;

  box-shadow: 0 4px 0 rgba(0,0,0,0.25);

  transition: transform 0.1s;
}

.sound-file:active {
  transform: scale(0.96);
}

/* BUTTON COLORS */

.green {
  background: #28a745;
}

.yellow {
  background: #ffc107;
  color: black;
}

.red {
  background: #dc3545;
}

.blue {
  background: #1769aa;
}

.purple {
  background: #7138a5;
}

.orange {
  background: #e87522;
}

.darkblue {
  background: #263c75;
}

/* PLAYING BUTTON */

.sound-file.playing {
  outline: 4px solid white;
  outline-offset: -4px;
  filter: brightness(1.15);
}

/* FILE DETAILS */

.file-icon {
  font-size: 25px;
}

.file-name {
  width: 100%;
  text-align: center;
  overflow-wrap: anywhere;
}

.duration {
  font-size: 12px;
  font-weight: normal;
  opacity: 0.9;
}

.progress {
  width: 90%;
  height: 6px;
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: white;
}

/* PLAYER */

#timer {
  color: white;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  padding: 5px;
}

#stop {
  width: 100%;
  min-height: 70px;
  border: none;
  border-radius: 17px;
  background: #202020;
  color: white;
  font-size: 26px;
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
}

#stop:active {
  transform: scale(0.97);
}

/* SMALL SCREENS */

@media (max-width: 350px) {
  .folder-content {
    gap: 7px;
    padding: 7px;
  }

  .sound-file {
    min-height: 105px;
    font-size: 13px;
  }
}

</style>
</head>

<body>

<div id="screen">

  <div id="status">🎮 SOUND EFFECTS</div>

  <div id="folders"></div>

  <div id="timer">00:00 / 00:00</div>

  <button id="stop" onclick="stopSound()">
    ⏹ STOP SOUND
  </button>

</div>

<script>

// ==================================
// FOLDER AND SOUND ORGANIZATION
// ==================================

const soundEmojis = {
  // ANIMALS
  crickets: "🦗",
  duckquack: "🦆",
  goat: "🐐",
  marmot: "🦫",

  // EFFECTS
  augh: "😵",
  bruh: "💀",
  correct: "🟢",
  "dun dun": "😨",
  tada: "🎉",
  whip: "🏏",

  // MEMES
  easy: "😎",
  fine: "😢",
  nooo: "😭",
  omgbruh: "💀",
  romance: "❤️",
  wow: "😮",
  yeahboi: "🔥",
  grapes: "🍇",
  time: "⏳",
  emotionaldamage: "💔",
  // SONGS
  clown: "🤡",
  dirtman: "🛌🏻",
  jeopardy: "🎵",
  jet2holiday: "✈️",
  penapple: "🍍",
  corn: "🌽",

  // TV
  thatsroughbuddy: "🥲",
  ready: "🍍🧽",
  spongebobfail: "❌",
  mayo: "🫙",
};

const folderData = [

  {
    name: "animals",
    sounds: [
      "crickets",
      "duckquack",
      "goat",
      "marmot"
    ]
  },

  {
    name: "effects",
    sounds: [
      "augh",
      "bruh",
      "correct",
      "dun dun",
      "tada",
      "whip"
    ]
  },

  {
    name: "memes",
    sounds: [
      "easy",
      "fine",
      "nooo",
      "omgbruh",
      "romance",
      "wow",
      "yeahboi",
      "jet2holiday",
      "grapes",
      "time",
      "emotionaldamage"
    ]
  },

  {
    name: "songs",
    sounds: [
      "clown",
      "dirtman",
      "jeopardy",
      "penapple",
      "corn"
    ]
  },

  {
    name: "TV",
    sounds: [
      "thatsroughbuddy",
      "ready",
      "spongebobfail",
      "mayo"
    ]
  }

];

// ==================================
// COLOR ROTATION
// ==================================

const colors = [
  "green",
  "yellow",
  "red",
  "blue",
  "purple",
  "orange",
  "darkblue"
];

// ==================================
// CREATE FOLDERS AND FILES
// ==================================

const folders = document.getElementById("folders");

let currentSound = null;
let currentButton = null;

let audioPlayers = [];

folderData.forEach(folder => {

  // CREATE FOLDER HEADER

  const header = document.createElement("button");

  header.className = "folder-header";

  header.innerHTML = `
    <span class="arrow">⌄</span>
    <span class="folder-icon">📁</span>
    <span>${folder.name}</span>
  `;

  const content = document.createElement("div");

  content.className = "folder-content";

  // EXPAND / COLLAPSE FOLDER

  header.addEventListener("click", () => {

    content.classList.toggle("hidden");
    header.classList.toggle("closed");

  });

  // CREATE MP3 BUTTONS

  folder.sounds.forEach((soundName, index) => {

    const audio = document.createElement("audio");

    audio.src =
      "sounds/" +
      folder.name +
      "/" +
      encodeURIComponent(soundName) +
      ".mp3";

    audio.preload = "metadata";

    document.body.appendChild(audio);

    audioPlayers.push(audio);

    // BUTTON

    const button = document.createElement("button");

    button.className =
      "sound-file " +
      colors[index % colors.length];

    button.innerHTML = `
      <span class="file-icon">
        ${soundEmojis[soundName] || "🎵"}
      </span>

      <span class="file-name">
        ${soundName}
      </span>

      <span class="duration">
        Loading...
      </span>

      <div class="progress">
        <div class="progress-fill"></div>
      </div>
    `;

    const durationDisplay =
      button.querySelector(".duration");

    // LOAD DURATION

    function showDuration() {

      if (Number.isFinite(audio.duration)) {

        durationDisplay.textContent =
          formatTime(audio.duration);

      }

    }

    audio.addEventListener("loadedmetadata", showDuration);
    audio.addEventListener("durationchange", showDuration);

    audio.addEventListener("error", () => {

      durationDisplay.textContent =
        "FILE NOT FOUND";

    });

    // UPDATE PROGRESS

    audio.addEventListener("timeupdate", () => {

      if (audio === currentSound) {

        updateProgress();

      }

    });

    // WHEN SOUND FINISHES

    audio.addEventListener("ended", () => {

      if (audio === currentSound) {

        resetDisplay();

        currentSound = null;
        currentButton = null;

        document.getElementById("timer").textContent =
          "00:00 / 00:00";

        document.getElementById("status").textContent =
          "🎮 SOUND EFFECTS";

      }

    });

    // PLAY SOUND

    button.addEventListener("click", () => {

      playSound(audio, button, soundName);

    });

    content.appendChild(button);

  });

  folders.appendChild(header);
  folders.appendChild(content);

});

// ==================================
// FORMAT TIME
// ==================================

function formatTime(seconds) {

  if (!Number.isFinite(seconds)) {
    return "00:00";
  }

  const minutes = Math.floor(seconds / 60);

  const secs = Math.floor(seconds % 60);

  return String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");

}

// ==================================
// PLAY SOUND
// ==================================

function playSound(audio, button, name) {

  stopSound();

  currentSound = audio;
  currentButton = button;

  currentButton.classList.add("playing");

  document.getElementById("status").textContent =
    "▶ PLAYING: " + name.toUpperCase();

  audio.currentTime = 0;

  audio.play().catch(error => {

    console.log("Playback error:", error);

    document.getElementById("status").textContent =
      "⚠️ SOUND COULD NOT PLAY";

    resetDisplay();

    currentSound = null;
    currentButton = null;

  });

}

// ==================================
// UPDATE PROGRESS AND TIMER
// ==================================

function updateProgress() {

  if (!currentSound) return;

  const duration = currentSound.duration;

  const current = currentSound.currentTime;

  document.getElementById("timer").textContent =
    formatTime(current) +
    " / " +
    formatTime(duration);

  if (currentButton && duration > 0) {

    const fill =
      currentButton.querySelector(".progress-fill");

    if (fill) {

      fill.style.width =
        (current / duration * 100) + "%";

    }

  }

}

// ==================================
// RESET DISPLAY
// ==================================

function resetDisplay() {

  document.querySelectorAll(".sound-file").forEach(button => {

    button.classList.remove("playing");

    const fill =
      button.querySelector(".progress-fill");

    if (fill) {

      fill.style.width = "0%";

    }

  });

}

// ==================================
// STOP ALL SOUNDS
// ==================================

function stopSound() {

  audioPlayers.forEach(audio => {

    audio.pause();
    audio.currentTime = 0;

  });

  resetDisplay();

  currentSound = null;
  currentButton = null;

  document.getElementById("timer").textContent =
    "00:00 / 00:00";

  document.getElementById("status").textContent =
    "🎮 SOUND EFFECTS";

}

</script>

</body>
</html>
