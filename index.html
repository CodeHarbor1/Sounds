
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Game Show Soundboard</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #252525;
  color: white;
}

body {
  padding-bottom: 12px;
}

#screen {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
}

#status {
  background: #dc3545;
  color: white;
  padding: 16px 8px;
  border-radius: 15px;
  text-align: center;
  font-size: clamp(22px, 5vw, 32px);
  font-weight: bold;
}

#folders {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.folder-header {
  width: 100%;
  min-height: 45px;
  border: none;
  background: #0756c9;
  color: white;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 12px;
  font-size: 23px;
  font-weight: bold;
  text-align: left;
  cursor: pointer;
}

.folder-header:active {
  background: #003d9e;
}

.arrow {
  font-size: 22px;
  width: 20px;
  transition: transform 0.15s;
}

.folder-header.closed .arrow {
  transform: rotate(-90deg);
}

.folder-icon {
  font-size: 25px;
}

.folder-content {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding: 10px;
  background: #252525;
}

.folder-content.hidden {
  display: none;
}

.sound-file {
  width: 100%;
  min-width: 0;
  min-height: 115px;
  border: none;
  border-radius: 17px;
  color: white;
  font-size: clamp(14px, 3.5vw, 21px);
  font-weight: bold;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 7px;
  padding: 9px 5px;
  touch-action: manipulation;
  box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  transition: transform 0.1s;
}

.sound-file:active {
  transform: scale(0.96);
}

.green { background: #28a745; }
.yellow { background: #ffc107; color: black; }
.red { background: #dc3545; }
.blue { background: #1769aa; }
.purple { background: #7138a5; }
.orange { background: #e87522; }
.darkblue { background: #263c75; }

.sound-file.playing {
  outline: 4px solid white;
  outline-offset: -4px;
  filter: brightness(1.15);
}

.file-icon {
  font-size: 25px;
}

.file-name {
  width: 100%;
  text-align: center;
  overflow-wrap: anywhere;
}

.duration {
  font-size: 12px;
  font-weight: normal;
  opacity: 0.9;
}

.progress {
  width: 90%;
  height: 6px;
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: white;
}

#timer {
  color: white;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  padding: 5px;
}

#stop {
  width: 100%;
  min-height: 70px;
  border: none;
  border-radius: 17px;
  background: #202020;
  color: white;
  font-size: 26px;
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
}

#stop:active {
  transform: scale(0.97);
}

@media (max-width: 350px) {
  .folder-content {
    gap: 7px;
    padding: 7px;
  }

  .sound-file {
    min-height: 105px;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div id="screen">

  <div id="status">🎮 SOUND EFFECTS</div>

  <div id="folders"></div>

  <div id="timer">00:00 / 00:00</div>

  <button id="stop" onclick="stopSound()">
    ⏹ STOP SOUND
  </button>

</div>

<script>

// ==================================
// EMOJIS
// ==================================

const soundEmojis = {

  jet2holiday: "✈️",
  penapple: "🍍",

  corn: "🌽",
  wiishop: "🛒",
  wiimusic: "🎶",
  heya: "👋🏻",
  gagamstyle: "🤪",
  spongebob: "🤪",
  baconpancakes: "🥞",
  ready: "🍍🧽",
  spongebobfail: "❌",
  mayo: "🫙",
  money: "💰",
  ohbrother: "🤪",
  victory: "🏆",
  thatsroughbuddy: "🥲",
  tiredgrandpa: "🥲",
  gohere: "👉🏻",
  coincidence: "🤪",
  birdculture: "🐦",
  dishonor: "🐉",
  myleg: "🦵",
};

// ==================================
// FOLDERS
// ==================================

const folderData = [

  {
    name: "animals",
    sounds: [
      "crickets",
      "duckquack",
      "goat",
      "marmot"
    ]
  },

  {
    name: "effects",
    sounds: [
      "augh",
      "bruh",
      "correct",
      "dun dun",
      "tada",
      "happi",
      "whip",
      "yeahbaby",
      "congrats",
      "whyareyoubooing",
      "wahwahwah"
    ]
  },

  {
    name: "memes",
    sounds: [
      "easy",
      "fine",
      "nooo",
      "omgbruh",
      "romance",
      "wow",
      "yeahboi",
      "jet2holiday",
      "grapes",
      "time",
      "emotionaldamage",
      "oof",
      "johncena",
      "sadviolin",
      "thatswhatshesaid",
      "wilheamscream",
      "sixseven",
      "doit",
      "jazz",
      "igotschool",
      "dreammemes",
    ]
  },

  {
    name: "songs",
    sounds: [
      "clown",
      "dirtman",
      "jeopardy",
      "penapple",
      "corn",
      "wiishop",
      "wiimusic",
      "spongebob",
      "baconpancakes",
      "heya",
      "gagamstyle",
      "crabrave",
      "titanic",
    ]
  },

  {
    name: "TV and Movies",
    sounds: [
      "ready",
      "myleg",
      "spongebobfail",
      "mayo",
      "money",
      "ohbrother",
      "victory",
      "thatsroughbuddy",
      "tiredgrandpa",
      "gohere",
      "coincidence",
      "birdculture",
      "dishonor",
      "pleaseno"
    ]
  }

];

// ==================================
// COLORS
// ==================================

const colors = [
  "green",
  "yellow",
  "red",
  "blue",
  "purple",
  "orange",
  "darkblue"
];

// ==================================
// ONE REUSABLE AUDIO PLAYER
// ==================================

const audio = new Audio();

audio.preload = "none";

let currentButton = null;
let currentDurationDisplay = null;

const folders = document.getElementById("folders");
const status = document.getElementById("status");
const timer = document.getElementById("timer");

// ==================================
// FORMAT TIME
// ==================================

function formatTime(seconds) {

  if (!Number.isFinite(seconds)) {
    return "00:00";
  }

  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");
}

// ==================================
// CREATE FOLDERS AND BUTTONS
// ==================================

folderData.forEach(folder => {

  const header = document.createElement("button");

  header.className = "folder-header";

  header.innerHTML = `
    <span class="arrow">⌄</span>
    <span class="folder-icon">📁</span>
    <span>${folder.name}</span>
  `;

  const content = document.createElement("div");

  content.className = "folder-content";

  header.addEventListener("click", () => {

    content.classList.toggle("hidden");
    header.classList.toggle("closed");

  });

  folder.sounds.forEach((soundName, index) => {

    const audioPath =
      "sounds/" +
      folder.name +
      "/" +
      encodeURIComponent(soundName) +
      ".mp3";

    const button = document.createElement("button");

    button.className =
      "sound-file " +
      colors[index % colors.length];

    button.innerHTML = `
      <span class="file-icon">
        ${soundEmojis[soundName] || "🎵"}
      </span>

      <span class="file-name">
        ${soundName}
      </span>

      <span class="duration">
        Loading...
      </span>

      <div class="progress">
        <div class="progress-fill"></div>
      </div>
    `;

    const durationDisplay =
      button.querySelector(".duration");

    // LOAD DURATION WHEN NEEDED

    const metadataAudio = new Audio();

    metadataAudio.preload = "metadata";
    metadataAudio.src = audioPath;

    metadataAudio.addEventListener("loadedmetadata", () => {

      durationDisplay.textContent =
        formatTime(metadataAudio.duration);

      metadataAudio.removeAttribute("src");
      metadataAudio.load();

    }, { once: true });

    metadataAudio.addEventListener("error", () => {

      durationDisplay.textContent = "UNAVAILABLE";

    }, { once: true });

    // PLAY SOUND

    button.addEventListener("click", () => {

      playSound(audioPath, button, soundName, durationDisplay);

    });

    content.appendChild(button);

  });

  folders.appendChild(header);
  folders.appendChild(content);

});

// ==================================
// PLAY SOUND
// ==================================

// ==================================
// PLAY SOUND
// ==================================

function playSound(path, button, name, durationDisplay) {

  // If this exact sound is already playing, stop it
  if (currentButton === button && !audio.paused) {
    stopSound();
    return;
  }

  // Stop any other sound before playing this one
  stopSound();

  currentButton = button;
  currentDurationDisplay = durationDisplay;

  button.classList.add("playing");

  status.textContent =
    "▶ PLAYING: " + name.toUpperCase();

  audio.src = path;
  audio.load();

  audio.play().catch(error => {

    console.log("Playback error:", error);

    if (currentButton === button) {

      status.textContent =
        "⚠️ SOUND COULD NOT PLAY";

      stopSound();

    }

  });

}
// ==================================
// UPDATE TIMER AND PROGRESS
// ==================================

audio.addEventListener("timeupdate", () => {

  if (!currentButton) return;

  const current = audio.currentTime;
  const duration = audio.duration;

  timer.textContent =
    formatTime(current) +
    " / " +
    formatTime(duration);

  const fill =
    currentButton.querySelector(".progress-fill");

  if (fill && duration > 0) {

    fill.style.width =
      (current / duration * 100) + "%";

  }

});

// ==================================
// UPDATE DURATION
// ==================================

audio.addEventListener("loadedmetadata", () => {

  if (currentDurationDisplay) {

    currentDurationDisplay.textContent =
      formatTime(audio.duration);

  }

  timer.textContent =
    "00:00 / " + formatTime(audio.duration);

});

// ==================================
// SOUND FINISHED
// ==================================

audio.addEventListener("ended", () => {

  resetDisplay();

  currentButton = null;
  currentDurationDisplay = null;

  timer.textContent = "00:00 / 00:00";

  status.textContent = "🎮 SOUND EFFECTS";

});

// ==================================
// RESET BUTTONS
// ==================================

function resetDisplay() {

  document.querySelectorAll(".sound-file").forEach(button => {

    button.classList.remove("playing");

    const fill =
      button.querySelector(".progress-fill");

    if (fill) {
      fill.style.width = "0%";
    }

  });

}

// ==================================
// STOP SOUND
// ==================================

function stopSound() {

  audio.pause();

  audio.currentTime = 0;

  audio.removeAttribute("src");
  audio.load();

  resetDisplay();

  currentButton = null;
  currentDurationDisplay = null;

  timer.textContent = "00:00 / 00:00";

  status.textContent = "🎮 SOUND EFFECTS";

}

</script>

</body>
</html>
